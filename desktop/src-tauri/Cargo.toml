[package]
name = "aether"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gives us multi-webview windows (the in-app browser pane);
# `devtools` keeps the inspector reachable in release builds.
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# The loopback host that serves the DevTools front-end and bridges its CDP
# socket. Both sit on the hyper/tower stack reqwest already builds.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "rt", "macros", "time"] }
tokio-tungstenite = "0.29"
portable-pty = "0.9"
base64 = "0.22"
regex = "1"
globset = "0.4"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

