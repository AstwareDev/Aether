<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether</title>
z    <style>
      body {
        background-color: #000000;
        margin: 0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      #initial-loader {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }

      .logo-container {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo-img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 0.9;
        z-index: 10;
        animation: pulse-slow 2.5s ease-in-out infinite alternate;
      }

      .logo-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0) 70%);
        border-radius: 50%;
        z-index: 0;
        animation: glow-pulse 2.5s ease-in-out infinite alternate;
      }

      @keyframes pulse-slow {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.02); opacity: 1; }
      }

      @keyframes glow-pulse {
        0% { transform: scale(0.85); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      
      .loading-line {
        width: 100px;
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        position: relative;
        overflow: hidden;
        border-radius: 2px;
      }

      .loading-line::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 30px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 2px;
        animation: line-slide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes line-slide {
        0% { transform: translateX(-30px); }
        100% { transform: translateX(100px); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="logo-container">
          <div class="logo-glow"></div>
          <img src="/logo.svg" alt="Aether" class="logo-img" />
        </div>
        <div class="loading-line"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
